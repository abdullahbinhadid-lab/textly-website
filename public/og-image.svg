<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo icon -->
  <rect x="490" y="80" width="80" height="80" rx="20" fill="url(#logo)" filter="url(#glow)"/>
  <path d="M500 127V117a3 3 0 0 1 3-3h44a3 3 0 0 1 3 3v10M525 160h10M530 114v46" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="white">Textly</text>
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#a5b4fc">33 Free Online Text Tools</text>
  <!-- Features -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">100% Client-Side · Privacy-First · No Signup Required</text>
  <!-- Decorative orbs -->
  <circle cx="150" cy="150" r="120" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1050" cy="500" r="140" fill="#06b6d4" opacity="0.08"/>
  <circle cx="950" cy="120" r="80" fill="#6366f1" opacity="0.06"/>
